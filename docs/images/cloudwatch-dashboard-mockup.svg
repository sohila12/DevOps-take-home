<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="640" fill="#f1f5f9"/>

  <rect x="0" y="0" width="1200" height="56" fill="#0f172a"/>
  <text x="30" y="33" font-size="14" font-weight="600" fill="#e2e8f0">Monitoring — devops-takehome-dev-app</text>
  <rect x="900" y="16" width="270" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="1035" y="32" text-anchor="middle" font-size="10.5" font-weight="600" fill="#92400e">ILLUSTRATIVE MOCKUP — NOT A SCREENSHOT</text>

  <!-- Alarm summary strip -->
  <g filter="url(#shadow4)">
    <rect x="40" y="76" width="1120" height="70" rx="10" fill="#ffffff"/>
  </g>
  <circle cx="80" cy="111" r="8" fill="#22c55e"/>
  <text x="100" y="105" font-size="12" font-weight="700" fill="#0f172a">Unhealthy Host Count</text>
  <text x="100" y="122" font-size="11" fill="#16a34a">OK</text>

  <circle cx="420" cy="111" r="8" fill="#22c55e"/>
  <text x="440" y="105" font-size="12" font-weight="700" fill="#0f172a">High CPU (&gt;80%)</text>
  <text x="440" y="122" font-size="11" fill="#16a34a">OK</text>

  <circle cx="760" cy="111" r="8" fill="#22c55e"/>
  <text x="780" y="105" font-size="12" font-weight="700" fill="#0f172a">ALB 5xx Rate</text>
  <text x="780" y="122" font-size="11" fill="#16a34a">OK</text>

  <!-- CPU chart -->
  <g filter="url(#shadow4)">
    <rect x="40" y="166" width="540" height="220" rx="10" fill="#ffffff"/>
  </g>
  <text x="64" y="194" font-size="12.5" font-weight="700" fill="#0f172a">CPUUtilization (Average)</text>
  <line x1="64" y1="350" x2="546" y2="350" stroke="#e2e8f0"/>
  <line x1="64" y1="300" x2="546" y2="300" stroke="#f1f5f9"/>
  <line x1="64" y1="250" x2="546" y2="250" stroke="#f1f5f9"/>
  <line x1="64" y1="210" x2="546" y2="210" stroke="#f1f5f9"/>
  <polyline points="64,320 110,315 156,325 202,310 248,318 294,305 340,312 386,300 432,308 478,298 524,306"
