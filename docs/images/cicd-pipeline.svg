<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="#ffffff"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#0f172a">CI/CD Pipeline</text>
  <text x="40" y="63" font-size="12.5" fill="#64748b">.github/workflows/deploy.yml — triggered on push to main, scoped to app/backend/**</text>

  <!-- Stage boxes -->
  <!-- 1 -->
  <g filter="url(#shadow2)">
    <rect x="40" y="110" width="150" height="90" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  </g>
  <text x="115" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Build &amp; Test</text>
  <text x="115" y="160" text-anchor="middle" font-size="10.5" fill="#3b82f6">pytest against</text>
  <text x="115" y="174" text-anchor="middle" font-size="10.5" fill="#3b82f6">Flask routes</text>

  <!-- 2 -->
  <g filter="url(#shadow2)">
    <rect x="230" y="110" width="150" height="90" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  </g>
  <text x="305" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Assume Role</text>
  <text x="305" y="160" text-anchor="middle" font-size="10.5" fill="#3b82f6">via OIDC</text>
  <text x="305" y="174" text-anchor="middle" font-size="10.5" fill="#3b82f6">no stored keys</text>

  <!-- 3 -->
  <g filter="url(#shadow2)">
    <rect x="420" y="110" width="150" height="90" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  </g>
  <text x="495" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Build Image</text>
  <text x="495" y="160" text-anchor="middle" font-size="10.5" fill="#16a34a">multi-stage</text>
  <text x="495" y="174" text-anchor="middle" font-size="10.5" fill="#16a34a">non-root user</text>

  <!-- 4 -->
  <g filter="url(#shadow2)">
    <rect x="610" y="110" width="150" height="90" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  </g>
  <text x="685" y="135" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Push to ECR</text>
  <text x="685" y="155" text-anchor="middle" font-size="10.5" fill="#16a34a">tag: &lt;git-sha&gt;</text>
  <text x="685" y="170" text-anchor="middle" font-size="10.5" fill="#16a34a">tag: latest</text>

  <!-- 5 -->
  <g filter="url(#shadow2)">
    <rect x="800" y="110" width="170" height="90" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  </g>
  <text x="885" y="135" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">New Launch</text>
  <text x="885" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">Template Version</text>
  <text x="885" y="172" text-anchor="middle" font-size="10.5" fill="#d97706">points at new tag</text>

  <!-- 6 -->
  <g filter="url(#shadow2)">
    <rect x="1000" y="110" width="160" height="90" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  </g>
  <text x="1080" y="135" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">Instance Refresh</text>
  <text x="1080" y="155" text-anchor="middle" font-size="10.5" fill="#dc2626">rolling, 50%</text>
  <text x="1080" y="170" text-anchor="middle" font-size="10.5" fill="#dc2626">min healthy</text>

  <!-- Arrows -->
  <path d="M190,155 L228,155" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow2)"/>
  <path d="M380,155 L418,155" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow2)"/>
  <path d="M570,155 L608,155" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow2)"/>
  <path d="M760,155 L798,155" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow2)"/>
  <path d="M970,155 L998,155" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow2)"/>

  <!-- Bottom: what this gets you -->
  <g filter="url(#shadow2)">
    <rect x="40" y="250" width="1120" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  </g>
  <text x="65" y="280" font-size="13" font-weight="700" fill="#0f172a">Zero-downtime by design</text>
  <text x="65" y="300" font-size="11.5" fill="#475569">Rolling instance refresh keeps at least 50% of capacity healthy throughout the rollout — the ALB never</text>
  <text x="65" y="317" font-size="11.5" fill="#475569">stops serving traffic. No SSH step anywhere in this pipeline; every AWS action runs under a short-lived,</text>
  <text x="65" y="334" font-size="11.5" fill="#475569">repo-and-branch-scoped OIDC credential that expires when the job ends.</text>
</svg>
