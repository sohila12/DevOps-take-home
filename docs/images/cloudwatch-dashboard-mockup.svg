  <g filter="url(#shadow4)">
    <rect x="40" y="410" width="1120" height="190" rx="10" fill="#0f172a"/>
  </g>
  <text x="64" y="438" font-size="12" font-weight="700" fill="#e2e8f0">/devops-takehome/dev/app</text>
  <text x="64" y="466" font-size="11" fill="#86efac" font-family="Consolas, monospace">[INFO] Starting gunicorn 22.0.0</text>
  <text x="64" y="486" font-size="11" fill="#86efac" font-family="Consolas, monospace">[INFO] Listening at: http://0.0.0.0:5000</text>
  <text x="64" y="506" font-size="11" fill="#93c5fd" font-family="Consolas, monospace">10.0.0.36 - "GET /health HTTP/1.1" 200 58 "ELB-HealthChecker/2.0"</text>
  <text x="64" y="526" font-size="11" fill="#93c5fd" font-family="Consolas, monospace">10.0.1.237 - "GET /health HTTP/1.1" 200 58 "ELB-HealthChecker/2.0"</text>
  <text x="64" y="546" font-size="11" fill="#fbbf24" font-family="Consolas, monospace">botocore.credentials Found credentials from IAM Role: devops-takehome-dev-ec2-role</text>
  <text x="64" y="566" font-size="11" fill="#93c5fd" font-family="Consolas, monospace">10.0.0.36 - "GET /ready HTTP/1.1" 200 19</text>
