  <text x="64" y="368" font-size="10" fill="#94a3b8">00:00</text>
  <text x="500" y="368" font-size="10" fill="#94a3b8">now</text>
  <text x="64" y="212" font-size="10" fill="#94a3b8">80%</text>

  <!-- Request count chart -->
  <g filter="url(#shadow4)">
    <rect x="600" y="166" width="560" height="220" rx="10" fill="#ffffff"/>
  </g>
  <text x="624" y="194" font-size="12.5" font-weight="700" fill="#0f172a">RequestCount (Sum, per minute)</text>
  <line x1="624" y1="350" x2="1136" y2="350" stroke="#e2e8f0"/>
  <g fill="#16a34a">
    <rect x="640" y="300" width="26" height="50"/>
    <rect x="686" y="280" width="26" height="70"/>
    <rect x="732" y="310" width="26" height="40"/>
    <rect x="778" y="260" width="26" height="90"/>
    <rect x="824" y="295" width="26" height="55"/>
    <rect x="870" y="270" width="26" height="80"/>
    <rect x="916" y="290" width="26" height="60"/>
    <rect x="962" y="255" width="26" height="95"/>
    <rect x="1008" y="285" width="26" height="65"/>
    <rect x="1054" y="265" width="26" height="85"/>
    <rect x="1100" y="295" width="26" height="55"/>
  </g>
  <text x="624" y="368" font-size="10" fill="#94a3b8">00:00</text>
  <text x="1090" y="368" font-size="10" fill="#94a3b8">now</text>

