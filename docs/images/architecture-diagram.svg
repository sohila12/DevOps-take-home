<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>

  <text x="40" y="46" font-size="22" font-weight="700" fill="#0f172a">AWS Architecture</text>
  <text x="40" y="68" font-size="13" fill="#64748b">devops-takehome — 3-tier application, provisioned by six Terraform modules</text>

  <!-- Internet -->
  <g filter="url(#shadow)">
    <rect x="520" y="100" width="160" height="44" rx="8" fill="#0f172a"/>
  </g>
  <text x="600" y="127" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Internet</text>

  <!-- Edge row -->
  <g filter="url(#shadow)">
    <rect x="60" y="190" width="260" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  </g>
  <text x="190" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">CloudFront</text>
  <text x="190" y="230" text-anchor="middle" font-size="11" fill="#3b82f6">CDN · default TLS cert</text>

  <g filter="url(#shadow)">
    <rect x="60" y="270" width="260" height="52" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  </g>
  <text x="190" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">S3 (frontend)</text>
  <text x="190" y="310" text-anchor="middle" font-size="11" fill="#16a34a">Private · Origin Access Control only</text>

  <g filter="url(#shadow)">
    <rect x="850" y="190" width="290" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  </g>
  <text x="995" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Application Load Balancer</text>
  <text x="995" y="230" text-anchor="middle" font-size="11" fill="#3b82f6">HTTP :80 · public subnets, 2 AZs</text>

  <!-- VPC boundary -->
  <rect x="660" y="340" width="500" height="410" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="678" y="365" font-size="12" font-weight="600" fill="#64748b">VPC — 10.0.0.0/16</text>

  <!-- Public subnets -->
  <g filter="url(#shadow)">
    <rect x="685" y="380" width="210" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  </g>
  <text x="790" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Public subnet AZ-a</text>
  <text x="790" y="422" text-anchor="middle" font-size="11" fill="#3b82f6">NAT Gateway</text>

  <g filter="url(#shadow)">
    <rect x="905" y="380" width="230" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  </g>
  <text x="1020" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Public subnet AZ-b</text>
  <text x="1020" y="422" text-anchor="middle" font-size="11" fill="#3b82f6">ALB target</text>

  <!-- Private subnets: EC2 -->
  <g filter="url(#shadow)">
    <rect x="685" y="460" width="450" height="80" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  </g>
  <text x="910" y="484" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">EC2 Auto Scaling Group</text>
  <text x="910" y="502" text-anchor="middle" font-size="11" fill="#16a34a">Amazon Linux 2023 + Docker · min 1 / max 2 · private subnets, 2 AZs</text>
  <text x="910" y="518" text-anchor="middle" font-size="11" fill="#16a34a">SSM Session Manager only — no SSH, no port 22</text>

  <!-- Private subnets: RDS -->
  <g filter="url(#shadow)">
    <rect x="685" y="560" width="450" height="64" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  </g>
  <text x="910" y="586" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">RDS PostgreSQL</text>
  <text x="910" y="604" text-anchor="middle" font-size="11" fill="#16a34a">Encrypted · Secrets Manager-held credentials · SG: EC2 only, 5432</text>

  <!-- Supporting services row -->
  <g filter="url(#shadow)">
    <rect x="685" y="650" width="140" height="60" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  </g>
  <text x="755" y="674" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">ECR</text>
  <text x="755" y="692" text-anchor="middle" font-size="10" fill="#d97706">image scan on push</text>

  <g filter="url(#shadow)">
    <rect x="838" y="650" width="140" height="60" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  </g>
  <text x="908" y="674" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">CloudWatch</text>
  <text x="908" y="692" text-anchor="middle" font-size="10" fill="#d97706">Logs + 3 alarms</text>

  <g filter="url(#shadow)">
    <rect x="991" y="650" width="144" height="60" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  </g>
  <text x="1063" y="674" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">SNS</text>
  <text x="1063" y="692" text-anchor="middle" font-size="10" fill="#d97706">email notifications</text>

  <!-- IAM note -->
  <g filter="url(#shadow)">
    <rect x="685" y="730" width="450" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  </g>
  <text x="910" y="756" text-anchor="middle" font-size="11" fill="#475569">Two least-privilege IAM roles · GitHub OIDC · no long-lived AWS keys anywhere</text>

  <!-- Arrows -->
  <path d="M560,144 C420,165 260,175 195,188" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M600,144 C700,165 900,175 990,188" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M190,242 L190,268" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M995,242 L995,378" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M910,440 L910,458" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M910,540 L910,558" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M820,540 C790,570 770,620 760,648" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M910,540 C910,590 908,620 908,648" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g transform="translate(40,730)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="20" y="11" font-size="11" fill="#475569">Public / edge</text>
    <rect x="140" y="0" width="14" height="14" rx="3" fill="#f0fdf4" stroke="#86efac"/>
    <text x="160" y="11" font-size="11" fill="#475569">Private subnet</text>
    <rect x="280" y="0" width="14" height="14" rx="3" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="300" y="11" font-size="11" fill="#475569">Supporting service</text>
  </g>
</svg>
