<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#0f172a">Infrastructure at a Glance</text>
  <text x="40" y="70" font-size="13" fill="#64748b">Six Terraform modules, one root module, one CI/CD pipeline</text>

  <!-- Stat cards row -->
  <g filter="url(#shadow6)">
    <rect x="40" y="100" width="255" height="110" rx="10" fill="#eff6ff"/>
  </g>
  <text x="65" y="150" font-size="34" font-weight="800" fill="#1d4ed8">6</text>
  <text x="65" y="175" font-size="12" fill="#1e40af">Terraform modules</text>
  <text x="65" y="192" font-size="10.5" fill="#3b82f6">networking · iam · database</text>

  <g filter="url(#shadow6)">
    <rect x="315" y="100" width="255" height="110" rx="10" fill="#f0fdf4"/>
  </g>
  <text x="340" y="150" font-size="34" font-weight="800" fill="#15803d">0</text>
  <text x="340" y="175" font-size="12" fill="#166534">SSH keys / open port 22s</text>
  <text x="340" y="192" font-size="10.5" fill="#16a34a">SSM Session Manager only</text>

  <g filter="url(#shadow6)">
    <rect x="590" y="100" width="255" height="110" rx="10" fill="#fffbeb"/>
  </g>
  <text x="615" y="150" font-size="34" font-weight="800" fill="#b45309">2</text>
  <text x="615" y="175" font-size="12" fill="#92400e">Least-privilege IAM roles</text>
  <text x="615" y="192" font-size="10.5" fill="#d97706">zero wildcard policies</text>

  <g filter="url(#shadow6)">
    <rect x="865" y="100" width="255" height="110" rx="10" fill="#fef2f2"/>
  </g>
  <text x="890" y="150" font-size="34" font-weight="800" fill="#b91c1c">3</text>
  <text x="890" y="175" font-size="12" fill="#991b1b">CloudWatch alarms</text>
  <text x="890" y="192" font-size="10.5" fill="#dc2626">unhealthy hosts, CPU, 5xx</text>

  <!-- Middle: pipeline strip -->
  <text x="40" y="252" font-size="14" font-weight="700" fill="#0f172a">Deployment flow</text>
  <g filter="url(#shadow6)">
    <rect x="40" y="270" width="1080" height="56" rx="28" fill="#f8fafc" stroke="#e2e8f0"/>
  </g>
  <text x="100" y="304" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">push</text>
  <text x="270" y="304" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">→ test</text>
  <text x="450" y="304" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">→ build image</text>
  <text x="650" y="304" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">→ push to ECR</text>
  <text x="850" y="304" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">→ new launch template</text>
  <text x="1055" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">→ live</text>

  <!-- Bottom: security highlights -->
  <text x="40" y="368" font-size="14" font-weight="700" fill="#0f172a">Security posture</text>

  <g>
    <circle cx="56" cy="392" r="4" fill="#16a34a"/>
    <text x="70" y="397" font-size="12" fill="#334155">Private subnets for EC2 and RDS — no public IPs</text>

    <circle cx="56" cy="418" r="4" fill="#16a34a"/>
    <text x="70" y="423" font-size="12" fill="#334155">GitHub OIDC — no long-lived AWS credentials stored anywhere</text>

    <circle cx="56" cy="444" r="4" fill="#16a34a"/>
    <text x="70" y="449" font-size="12" fill="#334155">RDS master password generated and held entirely by AWS Secrets Manager</text>

    <circle cx="56" cy="470" r="4" fill="#16a34a"/>
    <text x="70" y="475" font-size="12" fill="#334155">Encryption at rest: RDS storage, EBS root volume, S3 frontend bucket</text>

    <circle cx="600" cy="392" r="4" fill="#16a34a"/>
    <text x="614" y="397" font-size="12" fill="#334155">Security group chain: Internet → ALB → EC2 → RDS, one hop at a time</text>

    <circle cx="600" cy="418" r="4" fill="#16a34a"/>
    <text x="614" y="423" font-size="12" fill="#334155">S3 frontend fully private — reachable only via CloudFront + OAC</text>

    <circle cx="600" cy="444" r="4" fill="#16a34a"/>
    <text x="614" y="449" font-size="12" fill="#334155">ECR images scanned on push, lifecycle-capped at 10 images</text>

    <circle cx="600" cy="470" r="4" fill="#16a34a"/>
    <text x="614" y="475" font-size="12" fill="#334155">IMDSv2 required, hop-limited for correct container credential access</text>
  </g>

  <text x="40" y="530" font-size="11" fill="#94a3b8">Built for a Cloud/DevOps Engineer take-home assessment · Terraform · Docker · GitHub Actions</text>
</svg>
