<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <style>
    .box { fill: #eef3fb; stroke: #3b6ea5; stroke-width: 1.5; rx: 6; }
    .box-alt { fill: #f7f2e9; stroke: #b8862c; stroke-width: 1.5; rx: 6; }
    .box-private { fill: #eef7ee; stroke: #4a8a4a; stroke-width: 1.5; rx: 6; }
    .vpc { fill: none; stroke: #999; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 10; }
    .label { font-size: 13px; fill: #222; }
    .small { font-size: 11px; fill: #555; }
    .title { font-size: 16px; font-weight: bold; fill: #222; }
    .arrow { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>

  <text x="500" y="30" text-anchor="middle" class="title">DevOps Take-Home — AWS Architecture</text>

  <!-- Internet -->
  <rect x="430" y="55" width="140" height="35" class="box"/>
  <text x="500" y="77" text-anchor="middle" class="label">Internet</text>

  <!-- CloudFront + S3 (frontend, left) -->
  <rect x="60" y="130" width="220" height="35" class="box"/>
  <text x="170" y="152" text-anchor="middle" class="label">CloudFront (CDN)</text>

  <rect x="60" y="190" width="220" height="35" class="box-private"/>
  <text x="170" y="212" text-anchor="middle" class="label">S3 (private, OAC only)</text>

  <!-- ALB -->
  <rect x="700" y="130" width="220" height="35" class="box"/>
  <text x="810" y="152" text-anchor="middle" class="label">Application Load Balancer</text>

  <!-- VPC boundary -->
  <rect x="470" y="185" width="470" height="470" class="vpc"/>
  <text x="480" y="205" class="small">VPC 10.0.0.0/16</text>

  <!-- Public subnets -->
  <rect x="490" y="215" width="200" height="60" class="box"/>
  <text x="590" y="240" text-anchor="middle" class="label">Public subnet AZ-a</text>
  <text x="590" y="258" text-anchor="middle" class="small">ALB, NAT Gateway</text>

  <rect x="710" y="215" width="200" height="60" class="box"/>
  <text x="810" y="240" text-anchor="middle" class="label">Public subnet AZ-b</text>
  <text x="810" y="258" text-anchor="middle" class="small">ALB</text>

  <!-- Private subnets: EC2 -->
  <rect x="490" y="300" width="200" height="90" class="box-private"/>
  <text x="590" y="322" text-anchor="middle" class="label">Private subnet AZ-a</text>
  <text x="590" y="342" text-anchor="middle" class="small">EC2 (ASG)</text>
  <text x="590" y="358" text-anchor="middle" class="small">Amazon Linux 2023 + Docker</text>
  <text x="590" y="374" text-anchor="middle" class="small">SSM Session Manager only</text>

  <rect x="710" y="300" width="200" height="90" class="box-private"/>
  <text x="810" y="322" text-anchor="middle" class="label">Private subnet AZ-b</text>
  <text x="810" y="342" text-anchor="middle" class="small">EC2 (ASG, min=1 max=2)</text>
  <text x="810" y="358" text-anchor="middle" class="small">pulls image from ECR</text>
  <text x="810" y="374" text-anchor="middle" class="small">no SSH / port 22</text>

  <!-- Private subnets: RDS -->
  <rect x="490" y="415" width="200" height="70" class="box-private"/>
  <text x="590" y="440" text-anchor="middle" class="label">RDS PostgreSQL</text>
  <text x="590" y="458" text-anchor="middle" class="small">private subnets, Multi-AZ optional</text>
  <text x="590" y="474" text-anchor="middle" class="small">SG: EC2 only, port 5432</text>

  <!-- NAT / IGW -->
  <rect x="710" y="415" width="200" height="45" class="box-alt"/>
  <text x="810" y="442" text-anchor="middle" class="label">Single NAT Gateway</text>

  <rect x="710" y="475" width="200" height="45" class="box-alt"/>
  <text x="810" y="502" text-anchor="middle" class="label">Internet Gateway</text>

  <!-- CloudWatch / SNS -->
  <rect x="490" y="510" width="200" height="45" class="box-alt"/>
  <text x="590" y="537" text-anchor="middle" class="label">CloudWatch Agent → Logs</text>

  <rect x="490" y="565" width="200" height="45" class="box-alt"/>
  <text x="590" y="592" text-anchor="middle" class="label">CloudWatch Alarms</text>

  <rect x="710" y="565" width="200" height="45" class="box-alt"/>
  <text x="810" y="592" text-anchor="middle" class="label">SNS → email</text>

  <!-- IAM / ECR note -->
  <rect x="490" y="620" width="420" height="45" class="box-alt"/>
  <text x="700" y="647" text-anchor="middle" class="label">ECR (image registry) — pulled via scoped least-privilege IAM role</text>

  <!-- Arrows -->
  <path class="arrow" d="M470,90 C400,110 260,110 190,128"/>
  <path class="arrow" d="M500,90 C520,105 700,120 780,128"/>
  <path class="arrow" d="M170,225 L170,188"/>
  <path class="arrow" d="M810,165 L810,213"/>
  <path class="arrow" d="M690,245 L708,245"/>
  <path class="arrow" d="M810,275 L810,298"/>
  <path class="arrow" d="M590,275 L590,298"/>
  <path class="arrow" d="M690,345 L708,478 L708,478"/>
  <path class="arrow" d="M810,390 C810,400 700,405 690,415"/>
  <path class="arrow" d="M810,460 L810,473"/>
  <path class="arrow" d="M810,520 C810,560 500,555 490,538"/>

  <text x="480" y="700" class="small">Solid boxes: green = private subnet resources, tan = supporting services, blue = edge/public.</text>
</svg>
